name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Accept SDK licenses + install packages
        run: |
          # Latest sdkmanager requires JDK 17+ but javax.xml.bind was removed in JDK 11+.
          # JAXB 2.3.1 runtime has transitive deps: istack-commons-runtime, stax-ex, txw2.
          # Download ALL required JARs and add to bootstrap classpath.
          echo "=== Downloading JAXB JARs (needed by sdkmanager on JDK 17) ==="
          JAXB_DIR=/tmp/jaxb
          mkdir -p $JAXB_DIR
          wget -q "https://repo1.maven.org/maven2/javax/xml/bind/jaxb-api/2.3.1/jaxb-api-2.3.1.jar" -O $JAXB_DIR/jaxb-api.jar
          wget -q "https://repo1.maven.org/maven2/org/glassfish/jaxb/jaxb-runtime/2.3.1/jaxb-runtime-2.3.1.jar" -O $JAXB_DIR/jaxb-runtime.jar
          wget -q "https://repo1.maven.org/maven2/javax/activation/activation/1.1.1/activation-1.1.1.jar" -O $JAXB_DIR/activation.jar
          wget -q "https://repo1.maven.org/maven2/com/sun/istack/istack-commons-runtime/3.0.12/istack-commons-runtime-3.0.12.jar" -O $JAXB_DIR/istack-commons-runtime.jar
          wget -q "https://repo1.maven.org/maven2/org/jvnet/staxex/stax-ex/1.8/stax-ex-1.8.jar" -O $JAXB_DIR/stax-ex.jar
          wget -q "https://repo1.maven.org/maven2/com/sun/xml/fastinfoset/FastInfoset/1.2.16/FastInfoset-1.2.16.jar" -O $JAXB_DIR/fastinfoset.jar
          wget -q "https://repo1.maven.org/maven2/org/glassfish/jaxb/txw2/2.3.1/txw2-2.3.1.jar" -O $JAXB_DIR/txw2.jar
          echo "=== Verifying downloads ==="
          ls -la $JAXB_DIR/
          # Verify all JARs downloaded successfully (non-zero size)
          for f in $JAXB_DIR/*.jar; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is missing or empty — download failed"
              exit 1
            fi
          done
          # Build a single classpath string for -Xbootclasspath/a:
          JAXB_CP=$(ls $JAXB_DIR/*.jar | tr '\n' ':')
          # -Xbootclasspath/a: IS honored by `java -jar` (CLASSPATH is NOT)
          export JAVA_TOOL_OPTIONS="-Xbootclasspath/a:${JAXB_CP%:}"
          export SKIP_JDK_VERSION_CHECK=true
          echo "=== Accepting licenses ==="
          # Use printf with enough y's instead of `yes` to avoid broken pipe
          # (yes | cmd causes SIGPIPE when cmd closes stdin → exit code 1)
          printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\ny\n' | sdkmanager --licenses 2>&1 || true
          echo "=== Installing packages ==="
          printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n' | sdkmanager --install "platform-tools" "build-tools;35.0.0" "platforms;android-35" "ndk;27.0.12077973" "cmake;3.22.1" 2>&1 || true
        shell: bash

      - name: Set SDK paths
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> local.properties
        shell: bash

      - name: Verify SDK/NDK setup
        run: |
          echo "=== SDK Root ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo ""
          echo "=== local.properties ==="
          cat local.properties
          echo ""
          echo "=== NDK directory ==="
          ls -la "$ANDROID_SDK_ROOT/ndk/27.0.12077973/" 2>&1 || echo "NDK NOT FOUND at expected path"
          echo ""
          echo "=== cmake ==="
          cmake --version 2>&1 || echo "cmake NOT FOUND"
        shell: bash

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Verify gradle-wrapper.jar is present and valid
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ "$(wc -c < gradle/wrapper/gradle-wrapper.jar)" -lt 1000 ]; then
            echo "gradle-wrapper.jar missing or too small — downloading fresh copy"
            curl -L -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          file gradle/wrapper/gradle-wrapper.jar
        shell: bash

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      - name: STEP 1 - Kotlin compile only (no native)
        id: kotlin
        run: |
          echo "=== Compiling Kotlin sources only ==="
          ./gradlew :app:compileDebugKotlin --no-daemon --console=plain --stacktrace 2>&1
          echo "KOTLIN_EXIT=$?"
        shell: bash

      # 🏗️ APK build ENABLED
      - name: STEP 2 - Full APK with native
        if: success()
        id: native
        run: |
          echo "=== Full APK build with native code ==="
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace 2>&1
          echo "ASSEMBLE_EXIT=$?"
        shell: bash

      - name: Run unit tests
        if: success()
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain
        shell: bash

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/outputs/logs/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: INTENDRA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/test-results/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
