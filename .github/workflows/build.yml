name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Accept SDK licenses + install packages
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT || '$ANDROID_SDK_ROOT' }}
        run: |
          echo "=== Accepting licenses ==="
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true
          yes | $ANDROID_SDK_ROOT/tools/bin/sdkmanager --licenses 2>&1 || true
          yes | sdkmanager --licenses 2>&1 || true
          echo "=== Installing packages ==="
          sdkmanager --install "platform-tools" "build-tools;35.0.0" "platforms;android-35" "ndk;27.0.12077973" "cmake;3.22.1" 2>&1 || echo "SDK install had some issues, continuing..."
        shell: bash

      - name: Set SDK paths
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> local.properties
        shell: bash

      - name: Verify SDK/NDK setup
        run: |
          echo "=== SDK Root ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo ""
          echo "=== local.properties ==="
          cat local.properties
          echo ""
          echo "=== NDK directory ==="
          ls -la "$ANDROID_SDK_ROOT/ndk/27.0.12077973/" 2>&1 || echo "NDK NOT FOUND at expected path"
          echo ""
          echo "=== cmake ==="
          cmake --version 2>&1 || echo "cmake NOT FOUND"
        shell: bash

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Verify gradle-wrapper.jar is present and valid
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ "$(wc -c < gradle/wrapper/gradle-wrapper.jar)" -lt 1000 ]; then
            echo "gradle-wrapper.jar missing or too small — downloading fresh copy"
            curl -L -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          file gradle/wrapper/gradle-wrapper.jar
        shell: bash

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      - name: STEP 1 - Kotlin compile only (no native)
        id: kotlin
        run: |
          echo "=== Compiling Kotlin sources only ==="
          ./gradlew :app:compileDebugKotlin --no-daemon --console=plain --stacktrace 2>&1
          echo "KOTLIN_EXIT=$?"
        shell: bash

      # 🏗️ APK build DISABLED — comment out 'if: false' below to re-enable
      - name: STEP 2 - Full APK with native
        if: false  # DISABLED: set to 'success()' to re-enable APK build
        id: native
        run: |
          echo "=== Full APK build with native code ==="
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace 2>&1
          echo "ASSEMBLE_EXIT=$?"
        shell: bash

      - name: Run unit tests
        if: success()
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain
        shell: bash

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/outputs/logs/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: false  # DISABLED: set to 'success()' to re-enable APK upload
        uses: actions/upload-artifact@v4
        with:
          name: INTERNDRA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/test-results/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
